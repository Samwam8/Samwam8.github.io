
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }}</title>

  <style>
    body {
      max-width: 850px;
      margin: 50px auto;
      padding: 0 25px;
      font-family: Arial, sans-serif;
      line-height: 1.7;
      color: #333;
    }

    h1, h2, h3 {
      line-height: 1.3;
    }

    img {
      max-width: 100%;
    }

    pre {
      overflow-x: auto;
      padding: 15px;
      background: #f4f4f4;
    }

    code {
      background: #f4f4f4;
      padding: 2px 4px;
    }

    blockquote {
      border-left: 3px solid #ccc;
      padding-left: 15px;
      color: #666;
    }

    table {
      border-collapse: collapse;
      width: 100%;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: left;
    }
  </style>
</head>
<body>
  {{ content }}
</body>
</html>
